<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TYPE RUSH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="TYPE RUSH ホーム">
          <span class="brand-mark">TR</span>
          <span>TYPE RUSH</span>
        </a>
        <div class="timer" aria-label="残り時間">
          <span class="timer-icon">◷</span>
          <span id="time">60</span>
        </div>
      </header>

      <section class="game" aria-live="polite">
        <div class="stats">
          <div class="stat">
            <span class="stat-label">SCORE</span>
            <strong id="score">0000</strong>
          </div>
          <div class="stat stat-right">
            <span class="stat-label">COMBO</span>
            <strong><span id="combo">0</span><small>×</small></strong>
          </div>
        </div>

        <div class="progress-track" aria-hidden="true">
          <div id="progress" class="progress-bar"></div>
        </div>

        <div class="word-card">
          <p id="japanese" class="japanese"></p>
          <p id="word" class="word" aria-label="タイプする英語"></p>
          <div class="input-wrap">
            <input id="typing-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="タイピング入力" placeholder="ここにタイプ..." />
          </div>
          <p id="feedback" class="feedback"></p>
        </div>

        <div class="controls">
          <div class="level-picker" aria-label="難易度">
            <button class="level active" data-level="easy" type="button">EASY</button>
            <button class="level" data-level="normal" type="button">NORMAL</button>
            <button class="level" data-level="hard" type="button">HARD</button>
          </div>
          <button id="start-button" class="start-button" type="button">
            <span>START</span>
            <span class="play-icon">▶</span>
          </button>
        </div>
      </section>
    </main>

    <dialog id="result-dialog">
      <div class="result-card">
        <p class="result-eyebrow">RESULT</p>
        <h2 id="result-title">タイムアップ！</h2>
        <div class="result-score">
          <span>SCORE</span>
          <strong id="final-score">0</strong>
        </div>
        <div class="result-details">
          <div><span>正解</span><strong id="correct-count">0</strong></div>
          <div><span>最高コンボ</span><strong id="best-combo">0</strong></div>
        </div>
        <button id="again-button" type="button">もう一度プレイ</button>
      </div>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
